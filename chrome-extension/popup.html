<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<title>實況預測控制台</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>實況預測控制台</h1>
        <button id="refresh" class="secondary">重新整理</button>
    </header>

    <section id="status" class="card hidden">
        <span id="status-text"></span>
    </section>

    <section class="card card_relative">
        <h2>管理者驗證</h2>
        <div id="admin-username" class="admin-username"></div>
        <label>
            管理者金鑰
            <input type="password" id="admin-token" placeholder="請輸入管理者金鑰">
        </label>
        <div class="actions">
            <button id="save-settings">儲存金鑰</button>
            <button id="clear-settings" class="danger secondary">清除</button>
        </div>
    </section>

    <section class="card">
        <h2>目前預測</h2>
        <div id="market-summary" class="empty">目前沒有進行中的預測，請先建立新的預測。</div>
    </section>

    <section class="card">
        <h2>開啟預測</h2>
        <label>
            預測 ID
            <input type="text" id="open-id" placeholder="例：match-2025-10-15">
        </label>
        <label>
            標題
            <input type="text" id="open-title" placeholder="範例：第三場誰會勝利？">
        </label>
        <div id="options-container"></div>
        <div class="actions">
            <button id="add-option" class="secondary">新增選項</button>
        </div>
        <button id="open-market" class="primary">開啟預測</button>
    </section>

    <section class="card">
        <h2>關閉預測</h2>
        <label>
            選擇預測
            <select id="close-market-select"></select>
        </label>
        <p class="card-help">關閉預測後會立即停止接收新的玩家預測。</p>
        <button id="close-market" class="primary">關閉預測</button>
    </section>

    <section class="card">
        <h2>結算預測</h2>
        <label>
            選擇預測
            <select id="settle-market-select"></select>
        </label>
        <label>
            獲勝選項
            <select id="settle-option"></select>
        </label>
        <label id="settle-custom-wrapper" class="hidden">
            自訂選項 ID
            <input type="text" id="settle-custom" placeholder="請輸入獲勝選項 ID">
        </label>
        <p class="card-help">結算預測後會立即記錄勝負並封存結果。</p>
        <button id="settle-market" class="primary danger">結算預測</button>
    </section>

    <template id="option-template">
        <div class="option-row">
            <label>
                選項 ID
                <input type="text" class="option-id" placeholder="A">
            </label>
            <label>
                標籤
                <input type="text" class="option-label" placeholder="例：Team A">
            </label>
            <button class="remove-option secondary danger" title="移除選項">✕</button>
        </div>
    </template>

    <script src="popup.js" type="module"></script>
</body>
</html>
