<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>實況預測管理器</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>實況預測管理器</h1>
        <button id="refresh" class="secondary">重新整理</button>
    </header>

    <section id="status" class="card hidden">
        <span id="status-text"></span>
    </section>

    <section class="card">
        <h2>管理員登入</h2>
        <!-- <div id="admin-username" style="position: absolute; top: 12px; right: 16px; color: #888; font-size: 0.95em;"></div> -->
        <div id="admin-username" class="admin-username"></div>
        <label>
            管理員密鑰
            <input type="password" id="admin-token" placeholder="Required for admin endpoints">
        </label>
        <div class="actions">
            <button id="save-settings">儲存密鑰</button>
            <button id="clear-settings" class="danger secondary">清除</button>
        </div>
    </section>

    <section class="card">
        <h2>當前預測</h2>
        <div id="market-summary" class="empty">尚未加載任何預測。</div>
    </section>

    <section class="card">
        <h2>開啟預測</h2>
        <label>
            預測 ID
            <input type="text" id="open-id" placeholder="e.g. match-2025-10-15">
        </label>
        <label>
            標題
            <input type="text" id="open-title" placeholder="Who wins map 3?">
        </label>
        <div id="options-container"></div>
        <div class="actions">
            <button id="add-option" class="secondary">新增選項</button>
        </div>
        <button id="open-market" class="primary">開啟預測</button>
    </section>

    <section class="card">
        <h2>關閉預測</h2>
        <p class="card-help">在遊戲進行時禁止新的投票。</p>
        <button id="close-market" class="primary">關閉預測</button>
    </section>

    <section class="card">
        <h2>結算預測</h2>
        <label>
            勝出選項
            <select id="settle-option"></select>
        </label>
        <label id="settle-custom-wrapper" class="hidden">
            自訂選項 ID
            <input type="text" id="settle-custom" placeholder="輸入勝出選項 ID">
        </label>
        <p class="card-help">選擇勝出的選項，結算後將立即分配獎金。</p>
        <button id="settle-market" class="primary danger">結算預測</button>
    </section>

    <template id="option-template">
        <div class="option-row">
            <label>
                選項 ID
                <input type="text" class="option-id" placeholder="A">
            </label>
            <label>
                標籤
                <input type="text" class="option-label" placeholder="Team A">
            </label>
            <button class="remove-option secondary danger" title="Remove option">✕</button>
        </div>
    </template>

    <script src="popup.js" type="module"></script>
</body>
</html>
